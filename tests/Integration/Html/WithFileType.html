<form name="with_file" method="post" enctype="multipart/form-data">
  <div id="with_file">
    <div>
      <label for="with_file_document" class="required">Document</label>
      <input type="file" id="with_file_document" name="with_file[document]" required="required" accept="application/pdf,application/msword,.pdf,.doc,.docx"/>
    </div>
    <div>
      <label for="with_file_avatar" class="required">Avatar</label>
      <input type="file" id="with_file_avatar" name="with_file[avatar]" required="required" accept="image/*"/>
    </div>
    <div>
      <label for="with_file_thumbnail">Thumbnail</label>
      <input type="file" id="with_file_thumbnail" name="with_file[thumbnail]" accept="image/png"/>
    </div>
  </div>
</form>
