<form name="default_type_resolution" method="post">
  <div id="default_type_resolution">
    <div>
      <label for="default_type_resolution_string" class="required">String</label>
      <input type="text" id="default_type_resolution_string" name="default_type_resolution[string]" required="required"/>
    </div>
    <div>
      <label for="default_type_resolution_integer" class="required">Integer</label>
      <input type="number" id="default_type_resolution_integer" name="default_type_resolution[integer]" required="required"/>
    </div>
    <div>
      <label for="default_type_resolution_float" class="required">Float</label>
      <input type="text" id="default_type_resolution_float" name="default_type_resolution[float]" required="required" inputmode="decimal"/>
    </div>
    <div>
      <label for="default_type_resolution_boolean" class="required">Boolean</label>
      <input type="checkbox" id="default_type_resolution_boolean" name="default_type_resolution[boolean]" required="required" value="1"/>
    </div>
    <div>
      <label for="default_type_resolution_dateTime" class="required">Date Time</label>
      <input type="datetime-local" id="default_type_resolution_dateTime" name="default_type_resolution[dateTime]" required="required"/>
    </div>
    <div>
      <label for="default_type_resolution_dateTimeImmutable" class="required">Date Time Immutable</label>
      <input type="datetime-local" id="default_type_resolution_dateTimeImmutable" name="default_type_resolution[dateTimeImmutable]" required="required"/>
    </div>
    <div>
      <label class="required">Array</label>
      <div id="default_type_resolution_array"/>
    </div>
    <div>
      <label for="default_type_resolution_defaultsToText">Defaults To Text</label>
      <input type="text" id="default_type_resolution_defaultsToText" name="default_type_resolution[defaultsToText]"/>
    </div>
    <div>
      <label for="default_type_resolution_nullable">Nullable</label>
      <input type="text" id="default_type_resolution_nullable" name="default_type_resolution[nullable]"/>
    </div>
  </div>
</form>
