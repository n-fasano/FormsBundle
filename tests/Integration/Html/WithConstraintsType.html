<form name="with_constraints" method="post">
  <div id="with_constraints">
    <div>
      <label for="with_constraints_url" class="required">Url</label>
      <input type="url" id="with_constraints_url" name="with_constraints[url]" required="required"/>
    </div>
    <div>
      <label for="with_constraints_email" class="required">Email</label>
      <input type="email" id="with_constraints_email" name="with_constraints[email]" required="required"/>
    </div>
    <div>
      <label for="with_constraints_choice" class="required">Choice</label>
      <select id="with_constraints_choice" name="with_constraints[choice]">
        <option value="foo">foo</option>
        <option value="bar">bar</option>
      </select>
    </div>
    <div>
      <label for="with_constraints_dateTime" class="required">Date Time</label>
      <input type="datetime-local" id="with_constraints_dateTime" name="with_constraints[dateTime]" required="required"/>
    </div>
    <div>
      <label for="with_constraints_date" class="required">Date</label>
      <input type="date" id="with_constraints_date" name="with_constraints[date]" required="required"/>
    </div>
    <div>
      <label for="with_constraints_time" class="required">Time</label>
      <input type="time" id="with_constraints_time" name="with_constraints[time]" required="required"/>
    </div>
    <div>
      <label for="with_constraints_notBlank" class="required">Not Blank</label>
      <input type="text" id="with_constraints_notBlank" name="with_constraints[notBlank]" required="required"/>
    </div>
    <div>
      <label for="with_constraints_length" class="required">Length</label>
      <input type="text" id="with_constraints_length" name="with_constraints[length]" required="required" minlength="5" maxlength="10"/>
    </div>
    <div>
      <label for="with_constraints_regex" class="required">Regex</label>
      <input type="text" id="with_constraints_regex" name="with_constraints[regex]" required="required" pattern=".*\d{6}.*"/>
    </div>
    <div>
      <label for="with_constraints_range" class="required">Range</label>
      <input type="number" id="with_constraints_range" name="with_constraints[range]" required="required" min="3" max="12"/>
    </div>
    <div>
      <label for="with_constraints_positive" class="required">Positive</label>
      <input type="number" id="with_constraints_positive" name="with_constraints[positive]" required="required" min="1"/>
    </div>
    <div>
      <label for="with_constraints_positiveOrZero" class="required">Positive Or Zero</label>
      <input type="number" id="with_constraints_positiveOrZero" name="with_constraints[positiveOrZero]" required="required" min="0"/>
    </div>
    <div>
      <label for="with_constraints_negative" class="required">Negative</label>
      <input type="number" id="with_constraints_negative" name="with_constraints[negative]" required="required" max="-1"/>
    </div>
    <div>
      <label for="with_constraints_negativeOrZero" class="required">Negative Or Zero</label>
      <input type="number" id="with_constraints_negativeOrZero" name="with_constraints[negativeOrZero]" required="required" max="0"/>
    </div>
    <div>
      <label for="with_constraints_lessThan" class="required">Less Than</label>
      <input type="number" id="with_constraints_lessThan" name="with_constraints[lessThan]" required="required" max="2"/>
    </div>
    <div>
      <label for="with_constraints_lessThanOrEqual" class="required">Less Than Or Equal</label>
      <input type="number" id="with_constraints_lessThanOrEqual" name="with_constraints[lessThanOrEqual]" required="required" max="3"/>
    </div>
    <div>
      <label for="with_constraints_greaterThan" class="required">Greater Than</label>
      <input type="number" id="with_constraints_greaterThan" name="with_constraints[greaterThan]" required="required" min="4"/>
    </div>
    <div>
      <label for="with_constraints_greaterThanOrEqual" class="required">Greater Than Or Equal</label>
      <input type="number" id="with_constraints_greaterThanOrEqual" name="with_constraints[greaterThanOrEqual]" required="required" min="3"/>
    </div>
    <div>
      <label for="with_constraints_divisibleBy" class="required">Divisible By</label>
      <input type="number" id="with_constraints_divisibleBy" name="with_constraints[divisibleBy]" required="required" step="5"/>
    </div>
    <div>
      <label for="with_constraints_notNull" class="required">Not Null</label>
      <input type="text" id="with_constraints_notNull" name="with_constraints[notNull]" required="required"/>
    </div>
    <div>
      <label for="with_constraints_isTrue" class="required">Is True</label>
      <input type="checkbox" id="with_constraints_isTrue" name="with_constraints[isTrue]" required="required" value="1"/>
    </div>
    <div>
      <label for="with_constraints_uuid" class="required">Uuid</label>
      <input type="text" id="with_constraints_uuid" name="with_constraints[uuid]" required="required" pattern="[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"/>
    </div>
    <div>
      <label for="with_constraints_bic" class="required">Bic</label>
      <input type="text" id="with_constraints_bic" name="with_constraints[bic]" required="required" pattern="[A-Za-z]{4}[A-Za-z]{2}[A-Za-z0-9]{2}(?:[A-Za-z0-9]{3})?"/>
    </div>
    <div>
      <label for="with_constraints_iban" class="required">Iban</label>
      <input type="text" id="with_constraints_iban" name="with_constraints[iban]" required="required" pattern="[A-Za-z]{2}[0-9]{2}[A-Za-z0-9]{1,30}"/>
    </div>
    <div>
      <label for="with_constraints_isbn" class="required">Isbn</label>
      <input type="text" id="with_constraints_isbn" name="with_constraints[isbn]" required="required" pattern="[0-9]{9}[0-9X]|97[89][0-9]{10}"/>
    </div>
    <div>
      <label for="with_constraints_isbn10" class="required">Isbn10</label>
      <input type="text" id="with_constraints_isbn10" name="with_constraints[isbn10]" required="required" pattern="[0-9]{9}[0-9X]"/>
    </div>
    <div>
      <label for="with_constraints_isbn13" class="required">Isbn13</label>
      <input type="text" id="with_constraints_isbn13" name="with_constraints[isbn13]" required="required" pattern="97[89][0-9]{10}"/>
    </div>
    <div>
      <label for="with_constraints_card" class="required">Card</label>
      <input type="text" id="with_constraints_card" name="with_constraints[card]" required="required" pattern="4(?:[0-9]{12}|[0-9]{15}|[0-9]{18})|5[1-5][0-9]{14}|2(?:22[1-9][0-9]{12}|2[3-9][0-9]{13}|[3-6][0-9]{14}|7[0-1][0-9]{13}|720[0-9]{12})"/>
    </div>
    <div>
      <label for="with_constraints_password" class="required">Password</label>
      <input type="password" id="with_constraints_password" name="with_constraints[password]" required="required"/>
    </div>
    <div>
      <label for="with_constraints_ipv4" class="required">Ipv4</label>
      <input type="text" id="with_constraints_ipv4" name="with_constraints[ipv4]" required="required" pattern="\d{1,3}(\.\d{1,3}){3}"/>
    </div>
    <div>
      <label for="with_constraints_ip" class="required">Ip</label>
      <input type="text" id="with_constraints_ip" name="with_constraints[ip]" required="required" pattern="\d{1,3}(\.\d{1,3}){3}|[0-9a-fA-F:]{2,39}"/>
    </div>
    <div>
      <label for="with_constraints_cidr" class="required">Cidr</label>
      <input type="text" id="with_constraints_cidr" name="with_constraints[cidr]" required="required" pattern="(?:\d{1,3}(\.\d{1,3}){3})/\d{1,2}|(?:[0-9a-fA-F:]{2,39})/\d{1,3}"/>
    </div>
    <div>
      <label for="with_constraints_hostname" class="required">Hostname</label>
      <input type="text" id="with_constraints_hostname" name="with_constraints[hostname]" required="required" pattern="[a-zA-Z0-9](?:[a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?)*\.[a-zA-Z]{2,}"/>
    </div>
    <div>
      <label for="with_constraints_macAddress" class="required">Mac Address</label>
      <input type="text" id="with_constraints_macAddress" name="with_constraints[macAddress]" required="required" pattern="[0-9a-fA-F]{2}(?:[:\-][0-9a-fA-F]{2}){5}"/>
    </div>
    <div>
      <label for="with_constraints_ulid" class="required">Ulid</label>
      <input type="text" id="with_constraints_ulid" name="with_constraints[ulid]" required="required" pattern="[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}"/>
    </div>
    <div>
      <label for="with_constraints_json" class="required">Json</label>
      <textarea id="with_constraints_json" name="with_constraints[json]" required="required"/>
    </div>
  </div>
</form>
